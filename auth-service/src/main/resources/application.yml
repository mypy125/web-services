server:
  port: 8081

spring:
  data:
    redis:
      host: ${RDS_REMOTE_HOST}
      port: ${RDS_REMOTE_PORT}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms

  r2dbc:
    url: r2dbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5432}/${LOCAL_DB_NAME:auth_db}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    pool:
      initial-size: 10
      max-size: 20
      max-idle-time: 30m

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_auth
    url: ${LOCAL_DB_URL}auth_db
    user: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}

service:
  timeout:
    connect: 5000
    read: 30000
    write: 30000
  max:
    connections: 100

user:
  service:
    url: http://localhost:8082/api/users
    timeout: 5000
    retry:
      attempts: 3

seller:
  service:
    url: http://localhost:8083/api/sellers
    timeout: 5000
    retry:
      attempts: 3

cart:
  service:
    url: http://localhost:8084/api/carts
    timeout: 5000
    retry:
      attempts: 3

notification:
  service:
    url: http://localhost:8085/api/notifications
    timeout: 5000
    retry:
      attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: "*"

resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      cartService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
      sellerService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s

  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - java.net.ConnectException
      cartService:
        maxAttempts: 3
        waitDuration: 1s
      sellerService:
        maxAttempts: 3
        waitDuration: 1s

  timelimiter:
    instances:
      userService:
        timeoutDuration: 5s
      cartService:
        timeoutDuration: 5s
      sellerService:
        timeoutDuration: 5s

jwt:
  secretKey: ${JWT_SECRET_KEY}
  header: ${JWT_HEADER}

logging:
  level:
    com.mygitgor.auth_service.infrastructure.security: DEBUG
    org.springframework.security: DEBUG